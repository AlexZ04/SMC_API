spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Smc.api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SMC}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  forward-headers-strategy: framework

api-config:
  key: ${API_CONFIG_KEY:test-api-key}

monitoring:
  enabled: ${MONITORING_ENABLED:false}
  base-url: ${MONITORING_BASE_URL:http://localhost:8080/smc-monitoring}
  api-key: ${MONITORING_API_KEY:test-api-key}
  channel: ${MONITORING_CHANNEL:smc-api}
  time-zone: ${MONITORING_TIME_ZONE:Asia/Tomsk}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    config-url: /smc-api/v3/api-docs/swagger-config
    url: /smc-api/v3/api-docs

messages:
  return-to-main-screen: Возвращение в главное меню
  forbidden-access: |
    У вас недостаточно прав для выполнения данного действия!
    Если вы считаете, что это ошибка, обратитесь в сообщения группы СМК https://vk.com/smk_tsu
    Можете сообщить свой идентификатор администратору: {getId()}
